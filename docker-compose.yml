services:
  mysql:
    image: mysql:8.4
    container_name: devshare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev_share}
      MYSQL_USER: ${MYSQL_USER:?Configure MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD no .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - devshare_mysql:/var/lib/mysql

volumes:
  devshare_mysql:
