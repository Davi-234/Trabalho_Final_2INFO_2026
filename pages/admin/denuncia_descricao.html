<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Descrição da Denúncia</title>
    <link rel="stylesheet" href="../../assets/css/utilidades/estilo_principal.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/header.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/footer.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/denuncia_adm.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/admin.css">
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <!-- Logo + Nome do Projeto -->
        <div id="logo-container">
            <h1>
                <span>
                    <img src="../../assets/images/logo.png" alt="Project community logo" id="logo" />
                </span>
                DevShare
            </h1>
            <p>Compartilhe, avalie e evolua projetos com a comunidade</p>
        </div>

        <nav>
            <ul>
                <li><a href="analise_denuncias.html">Aba Denúncias</a></li>
                <li>
                    <form action="../../backend/controladores/logout.php" method="post">
                        <input type="hidden" name="csrf_token" id="csrf-logout">
                        <button type="submit">Sair</button>
                    </form>
                </li>
            </ul>
        </nav>
    </header>

    <!-- ================= MAIN ================= -->
    <main>
        <!-- Projeto -->
        <section id="denuncia" data-id="">
            <header>
                <h2>Denúncia de <span id="tipo-denuncia"></span></h2>
            </header>

            <section id="denunciante">
                Denunciante: <span id="nome-denunciante"></span>
            </section>

            <section id="denunciado">
                Denunciado: <strong id="alvo-denuncia"></strong>
                <p>Autor do conteúdo: <span id="autor-alvo"></span></p>
            </section>

            <section id="descricao">
                <h3>Motivo:</h3>
                <p id="motivo-denuncia"></p>
                <h3>Conteúdo denunciado:</h3>
                <p id="detalhes-alvo"></p>
            </section>

            <section id="data">
                <h3>Data da denúncia: <span id="data-denuncia"></span></h3>
            </section>

            <p id="mensagem-admin" class="mensagem-admin" role="status" aria-live="polite"></p>
            <footer>
                <nav>
                    <ul>
                        <li><button type="button" data-acao="concordar">Concordar e remover</button></li>
                        <li><button type="button" data-acao="ignorar">Ignorar denúncia</button></li>
                    </ul>
                </nav>
            </footer>
        </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer id="footer">
        DevShare — compartilhe ideias, encontre parceiros e transforme projetos em realidade.
    </footer>
</body>
<script src="../../assets/js/admin/painel.js"></script>

</html>
