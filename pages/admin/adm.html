<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../assets/css/entrada/login.css" />
  <link rel="stylesheet" href="../../assets/css/utilidades/formularios.css">
  <link rel="stylesheet" href="../../assets/css/utilidades/estilo_principal.css">
  <title>Login ADMIN</title>
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <style>
    #login-container {
      width: min(420px, 92%);
    }
  </style>
</head>

<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <div id="login-container">
      <section id="login-box">
        <h1 class="section-title">Login</h1>

        <form class="row g-3 needs-validation" novalidate>
          <div>
            <label for="validationCustom01" class="form-label">E-mail do administrador</label>
            <input type="email" class="form-control" id="validationCustom01" name="email"
              placeholder="Digite seu e-mail" autocomplete="username" required>
          </div>
          <div>
            <label for="validationCustom02" class="form-label">Senha</label>
            <input type="password" class="form-control" id="validationCustom02" name="senha"
              placeholder="Digite sua senha" autocomplete="current-password" required>
          </div>
          <p id="mensagem-login-admin" class="mensagem-admin" role="alert" aria-live="polite"></p>
          <div class="col-12">
            <button type="submit">Entrar</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../../assets/js/admin/painel.js"></script>

</html>
