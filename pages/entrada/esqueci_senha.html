<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/entrada/login.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/formularios.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/estilo_principal.css">
    <link rel="stylesheet" href="../../assets/css/utilidades/header.css">
</head>

<body>
    <main>
        <div id="login-container">
            <section id="login-box">
                <h1 class="section-title">Recuperar senha</h1>
                <p class="info-text">Informe o e-mail da sua conta para receber um link de redefinição.</p>
                <form id="recuperar-form">
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    <button class="btn" type="submit">Enviar link</button>
                </form>
                <p id="mensagem-recuperacao" role="status" aria-live="polite"></p>
                <p><a href="login.html">Voltar ao login</a></p>
            </section>
        </div>
    </main>
    <script src="../../assets/js/entrada/recuperar_senha.js"></script>
</body>

</html>
