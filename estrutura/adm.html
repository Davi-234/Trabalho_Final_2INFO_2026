<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../estilo/entrada/login.css" />
  <link rel="stylesheet" href="../estilo/utilidades/formularios.css">
  <link rel="stylesheet" href="../estilo/estilo_principal.css">
  <link rel="stylesheet" href="../estilo/header.css">
  <title>Login ADMIN</title>
  <link rel="icon" type="image/png" href="../img_para_projeto/logo.png">
  <style>
    #login-container {
      width: 25%;
    }
  </style>
</head>

<body>
  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <div id="login-container">
      <section id="login-box">
        <h1 class="section-title">Login</h1>

        <form class="row g-3 needs-validation" novalidate>
          <div>
            <label for="validationCustom01" class="form-label">Nome Administrador</label>
            <input type="text" class="form-control" id="validationCustom01" placeholder="Digite o seu nome" required>
          </div>
          <div>
            <label for="validationCustom02" class="form-label">Senha</label>
            <input type="password" class="form-control" id="validationCustom02" placeholder="Digite a sua senha"
              required>
          </div>
          <div class="col-12">
            <button class="" type="submit">Cadastrar</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
  // Example starter JavaScript for disabling form submissions if there are invalid fields
  (() => {
    'use strict'

    // Fetch all the forms we want to apply custom Bootstrap validation styles to
    const forms = document.querySelectorAll('.needs-validation')

    // Loop over them and prevent submission
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        event.preventDefault();

        if (!form.checkValidity()) {
          event.stopPropagation();
          form.classList.add('was-validated');
          return;
        }

        form.classList.add('was-validated');

        window.location.href = "analise_denuncias.html";
      });
    })
  })()
</script>

</html>
