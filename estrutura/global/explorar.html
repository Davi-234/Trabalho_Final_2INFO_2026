<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explorar Projetos</title>

  <link rel="stylesheet" href="../../estilo/global/explorar.css">
  <link rel="stylesheet" href="../../estilo/utilidades/estrela.css">
  <link rel="stylesheet" href="../../estilo/estilo_principal.css">
  <link rel="stylesheet" href="../../estilo/header.css">
  <link rel="stylesheet" href="../../estilo/utilidades/projetos.css">

  <link rel="icon" type="image/png" href="../../img_para_projeto/logo.png">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <div id="logo-container">

      <h1>
        <span>
          <img src="../../img_para_projeto/logo.png" alt="Logo do DevShare" id="logo">
        </span>

        DevShare
      </h1>

      <p>
        Compartilhe, avalie e evolua projetos com a comunidade
      </p>

    </div>

    <nav>
      <ul>
        <li>
          <a href="../usuario/home.html">
            Voltar para Home
          </a>
        </li>
      </ul>
    </nav>

  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <!-- ================= BUSCA ================= -->

    <section id="busca">

      <header>

        <h2>Explorar Projetos</h2>

        <p>
          Encontre projetos por tecnologia, nível ou popularidade
        </p>

      </header>


      <div id="buscador">

        <form action="#" method="get">

          <label for="palavra-chave">
            Buscar
          </label>

          <input type="text" id="palavra-chave" name="q" placeholder="Digite palavras-chave...">

          <button type="submit">
            Pesquisar
          </button>

        </form>

      </div>

    </section>


    <!-- ================= CONTEÚDO ================= -->

    <div id="conteudo">

      <section id="resultados">


        <!-- ================= FILTROS ================= -->

        <div id="filtros-container">

          <div id="filtros">

            <form action="#" method="post">

              <fieldset>

                <legend>
                  Filtrar Projetos
                </legend>


                <!-- Nível -->

                <label for="nivel">
                  Nível
                </label>

                <select id="nivel" name="nivel">

                  <option value="">
                    Todos
                  </option>

                  <option value="iniciante">
                    Iniciante
                  </option>

                  <option value="intermediario">
                    Intermediário
                  </option>

                  <option value="avancado">
                    Avançado
                  </option>

                </select>


                <!-- Tipo -->

                <label for="tipo">
                  Tipo de Projeto
                </label>

                <select id="tipo" name="tipo">

                  <option value="">
                    Todos
                  </option>

                  <option value="web">
                    Web
                  </option>

                  <option value="mobile">
                    Mobile
                  </option>

                  <option value="desktop">
                    Desktop
                  </option>

                  <option value="outro">
                    Outro
                  </option>

                </select>


                <!-- Tecnologias -->

                <label for="tecnologias">
                  Tecnologias
                </label>

                <input type="text" id="tecnologias" name="tecnologias" placeholder="Ex: HTML, Java, React">


                <!-- Ordenação -->

                <label for="ordenar">
                  Ordenar por
                </label>

                <select id="ordenar" name="ordenar">

                  <option value="recentes">
                    Mais recentes
                  </option>

                  <option value="views">
                    Mais vistos
                  </option>

                  <option value="avaliacao">
                    Mais bem avaliados
                  </option>

                  <option value="curtidas">
                    Mais Curtidos
                  </option>

                  <option value="comentarios">
                    Mais comentados
                  </option>

                </select>


                <!-- Inverter -->

                <label for="inverter">
                  Inverter
                </label>

                <input type="checkbox" name="inverter" id="inverter" style="width:auto;">


                <button type="submit">
                  Aplicar Filtros
                </button>

              </fieldset>

            </form>

          </div>

        </div>


        <!-- ================= RESULTADOS ================= -->

        <div id="lista-projetos">

          <header id="resultados-header">

            <h2>
              Resultados
            </h2>

          </header>

          <div id="projetos">
          </div>

        </div>


        <!-- ================= PAGINAÇÃO ================= -->

        <nav aria-label="Navegação das páginas" id="navegacao-paginacao">

          <ul class="pagination" id="paginacao">
          </ul>

        </nav>


      </section>

    </div>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer id="footer">

    DevShare - Sempre abertos à comunidade

  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script src="../../JS/jquerry.js"></script>

  <script src="../../JS/global/sort.js"></script>

  <script src="../../JS/global/cardBusca.js"></script>

</body>

</html>
