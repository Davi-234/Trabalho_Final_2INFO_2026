<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explorar Projetos</title>
  <link rel="stylesheet" href="../../estilo/global/explorar.css" />
  <link rel="stylesheet" href="../../estilo//utilidades/estrela.css">
  <link rel="stylesheet" href="../../estilo/estilo_principal.css">
  <link rel="stylesheet" href="../../estilo/header.css">
  <link rel="stylesheet" href="../../estilo/utilidades/projetos.css">
  <link rel="icon" type="image/png" href="../../img_para_projeto/logo.png">
</head>

<body>
  <!-- ================= HEADER ================= -->
  <header>
    <!-- Logo + Nome do Projeto -->
    <div id="logo-container">
      <h1>
        <span>
          <img src="../../img_para_projeto/logo.png" alt="Project community logo" id="logo" />
        </span>
        DevShare
      </h1>
      <p>Compartilhe, avalie e evolua projetos com a comunidade</p>
    </div>

    <!-- Navegação -->
    <nav>
      <ul>
        <li><a href="../usuario/home.html">Voltar para Home</a></li>
      </ul>
    </nav>
  </header>

  <!-- ================= MAIN ================= -->
  <main>
    <!-- Área de busca -->
    <section id="busca">
      <header>
        <h2>Explorar Projetos</h2>
        <p>Encontre projetos por tecnologia, nível ou popularidade</p>
      </header>

      <!-- Formulário de busca -->
      <div id="buscador">
        <form action="#" method="get">
          <label for="palavra-chave">Buscar</label>
          <input type="text" id="palavra-chave" name="q" placeholder="Digite palavras-chave..." />
          <button type="submit">Pesquisar</button>
        </form>
      </div>
    </section>

    <div id="conteudo">
      <!-- Lista de projetos -->
      <section id="resultados">
        <!-- Formulário de filtros -->
        <div id="filtros-container">
          <div id="filtros">
            <form action="#" method="post">
              <fieldset>
                <legend>Filtrar Projetos</legend>

                <!-- Nível -->
                <label for="nivel">Nível</label>
                <select id="nivel" name="nivel">
                  <option value="">Todos</option>
                  <option value="iniciante">Iniciante</option>
                  <option value="intermediario">Intermediário</option>
                  <option value="avancado">Avançado</option>
                </select>

                <!-- Tipo -->
                <label for="tipo">Tipo de Projeto</label>
                <select id="tipo" name="tipo">
                  <option value="">Todos</option>
                  <option value="web">Web</option>
                  <option value="mobile">Mobile</option>
                  <option value="desktop">Desktop</option>
                  <option value="outro">Outro</option>
                </select>

                <!-- Tecnologias -->
                <label for="tecnologias">Tecnologias</label>
                <input type="text" id="tecnologias" name="tecnologias" placeholder="Ex: HTML, Java, React" />

                <!-- Ordenação -->
                <label for="ordenar">Ordenar por</label>
                <select id="ordenar" name="ordenar">
                  <option value="recentes">Mais recentes</option>
                  <option value="views">Mais vistos</option>
                  <option value="avaliacao">Mais bem avaliados</option>
                  <option value="curtidas">Mais Curtidos</option>
                  <option value="comentarios">Mais comentados</option>
                </select>
                <label for="inverter">Inverter</label>
                <input type="checkbox" name="inverter" id="inverter" style="width:auto;">
                <button type="submit" onclick="">Aplicar Filtros</button>
              </fieldset>
            </form>
          </div>
        </div>

        <div id="lista-projetos">

          <header id="resultados-header">
            <h2>Resultados</h2>
          </header>
          <div id="projetos">
          </div>
        </div>

      </section>
    </div>
  </main>

  <!-- FOOTER -->
  <footer id="footer">
    DevShare - Sempre abertos à comunidade
  </footer>
</body>
<script src="../../JS/jquerry.js"></script>
<script src="../../JS/global/sort.js"></script>
<script src="../../JS/global/cardBusca.js"></script>


</html>
